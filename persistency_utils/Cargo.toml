[package]
name = "persistency_utils"
version.workspace = true
authors.workspace = true
description = "Storage orchestration: encrypt, index and retrieve content"
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
async-std = { version = "1.13.0", features = ["attributes"] }
dotenv = "0.15.0"
futures = "0.3.31"
libp2p = { version = "0.54.1", features = [ "tokio", "cbor", "dns", "kad", "noise", "ping", "macros", "request-response", "tcp", "quic", "websocket", "yamux"] }
rand = "0.8.5"
tokio = { version = "1.42.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
content-hashing = { path = "../content-hashing" }
metadata-mrkl   = { path = "../metadata-mrkl" }