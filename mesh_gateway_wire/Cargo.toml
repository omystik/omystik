[package]
name = "mesh_gateway_wire"
authors.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bc2wrap = { path = "../kms/bc2wrap" }  # Internal bincode wrapper custom implementation
blake3 = { workspace = true }
ed25519-dalek = "2.2.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.42.0", features = ["full"] }
tokio-util = {version = "0.7.13", features = ["compat"] }
clap = { version = "4.5.6", features = ["derive"] }
futures = { workspace = true }
libp2p = { version = "0.54.1", features = [ "tokio", "cbor", "dns", "identify", "kad", "noise", "relay", "rendezvous", "ping", "macros", "request-response", "tcp", "quic", "websocket", "yamux"] }
libp2p-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
sha2 = { workspace = true }

compute-abi = { path = "../compute-abi" }