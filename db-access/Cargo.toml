[package]
name = "db-access"
version.workspace = true
authors.workspace = true
description = "Recovery utility: rebuilds MID/CID pairs by walking the filesystem"
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
futures = "0.3.31"
hex = "0.4.3"
regex = "1.11.1"
sled = { version = "0.34.7"}
tokio = { version = "1.42.0", features = ["fs", "io-util", "full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
metadata-mrkl = { path = "../metadata-mrkl" }
content-hashing = { path = "../content-hashing" } 