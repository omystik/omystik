[package]
name = "node_autonomos"
version.workspace = true
authors.workspace = true
description = "sensor node in FHE p2p mesh"
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
bincode = { version = "=2.0.1", features = ["serde"] }  # Binary serialization
blake3 = "1.5.5"
clap = { version = "4.5.6", features = ["derive"] }
futures = "0.3.31"
libp2p = { version = "0.54.1", features = [ "tokio", "cbor", "dns", "identify", "kad", "noise", "relay", "rendezvous", "ping", "macros", "request-response", "tcp", "quic", "websocket", "yamux"] }
libp2p-stream = "0.2.0-alpha"
persistency_utils = { path = "../persistency_utils" }
prost = "0.13.5"
rand = "0.8.5"
serde = { version = "1.0.217", features = ["derive"] }
tokio = { version = "1.42.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = {version = "0.7.13", features = ["compat"] }
toml = "0.9.8"
tonic = "=0.13.1" #gRPCs
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

content-hashing = { path = "../content-hashing" }
kryptografia = { path = "../kryptografia" }
libp2p_common = { path = "../libp2p_common" }

[build-dependencies]
prost-build = "0.13.5"
tonic-build = "0.13.1"