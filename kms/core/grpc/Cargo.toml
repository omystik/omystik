[package]
name = "kms-grpc"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true

[lib] # GRPC client and server for KMS
name = "kms_grpc"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
kms_api = { package = "kms-api", path = "../api", default-features = false }
tonic = { workspace = true, optional = true}

[features]
default = ["non-wasm"]
non-wasm = ["dep:tonic", "kms_api/non-wasm"]
insecure = ["kms_api/insecure"]